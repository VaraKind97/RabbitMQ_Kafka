spring.application.name=credit-application-service
server:
  port: 8081

Spring:
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
datasource:
spring.datasource.url=jdbc:mysql://localhost:3306/mysql

mysql:
spring.datasource.username=root
spring.datasource.password=Varajava15697
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

flyway:
enabled: true
locations: classpath:db/migration
validate-on-migrate: true

kafka:
kafka.bootstrap-servers=localhost:9092
kafka.group.id=credit-processing-group
kafka.auto.offset.reset=earliest
producer:
key-serializer: org.apache.kafka.common.serialization.StringSerializer
value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

rabbitmq:
rabbit.host=localhost
rabbit.port=5672
rabbit.username=guest
rabbit.password=guest
rabbit.queue.name=credit-processing-queue
rabbit.exchange.name=credit-exchange
rabbit.routing.key=credit.routing

app:
kafka:
topic: application-created
rabbitmq:
queue: application-result
exchange: application-exchange

